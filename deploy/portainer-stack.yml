# Stack do Cabeça Leve para o Portainer (Swarm + Traefik, rede "cloud").
# Troque os 7 valores TROQUE_… e faça o deploy. Todas as outras chaves (Anthropic, Groq, UAZAPI,
# Asaas, Resend, push, Meta, suporte) se configuram depois no app, em /admin/configuracoes.
# Passo a passo: replica/deploy-vps.md
version: "3.8"

services:
  cabecaleve_app:
    image: ghcr.io/vozzyup/cabeca-leve:latest
    environment:
      SITE_URL: https://TROQUE_DOMINIO                        # ex.: https://app.cabecaleve.com.br
      SUPABASE_URL: https://TROQUE_PROJETO.supabase.co       # Supabase > Project Settings > API
      SUPABASE_PUBLISHABLE_KEY: TROQUE_CHAVE_PUBLISHABLE     # sb_publishable_…
      SUPABASE_SECRET_KEY: TROQUE_CHAVE_SECRET               # sb_secret_… (acesso total: só aqui)
      APP_SECRET_KEY: TROQUE_SEGREDO_DO_APP                  # openssl rand -hex 32 (criptografa as chaves da tela de admin; não troque depois)
      ADMIN_EMAILS: TROQUE_SEU_EMAIL                         # quem entra em /admin e /suporte/painel (separe por vírgula)
      CRON_SECRET: TROQUE_SEGREDO_DA_VARREDURA               # openssl rand -hex 32 (o mesmo no serviço abaixo)
      TZ: America/Sao_Paulo
    networks:
      cloud: null
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: "1073741824"
      labels:
        traefik.enable: "true"
        traefik.http.routers.cabecaleve.entrypoints: websecure
        traefik.http.routers.cabecaleve.rule: Host(`TROQUE_DOMINIO`)
        traefik.http.routers.cabecaleve.priority: "1"
        traefik.http.routers.cabecaleve.service: cabecaleve
        traefik.http.routers.cabecaleve.tls.certresolver: letsencryptresolver
        traefik.http.services.cabecaleve.loadbalancer.passhostheader: "true"
        traefik.http.services.cabecaleve.loadbalancer.server.port: "3000"

  # Lembretes e resumo da manhã: chama a varredura a cada minuto
  cabecaleve_varredura:
    image: curlimages/curl:8.10.1
    environment:
      CRON_SECRET: TROQUE_SEGREDO_DA_VARREDURA
    command: ["sh", "-c", "sleep 30; while true; do curl -fsS -m 55 -H \"Authorization: Bearer $$CRON_SECRET\" http://tasks.cabecaleve_app:3000/api/cron/sweep > /dev/null || echo 'varredura falhou'; sleep 60; done"]
    networks:
      cloud: null
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.1"
          memory: "33554432"

networks:
  cloud:
    name: cloud
    external: true
