# Variante sem Swarm e sem Traefik (Portainer com Docker "standalone"): o app fica na porta
# APP_PORT da VPS e você aponta o seu proxy (Nginx Proxy Manager, Caddy…) para ela, com HTTPS.
# Mesmas variáveis do deploy/stack.env.example.
services:
  app:
    image: ${IMAGE:-ghcr.io/vozzyup/cabeca-leve:latest}
    restart: unless-stopped
    ports: ["${APP_PORT:-3000}:3000"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      SITE_URL: https://${DOMAIN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-uazapi}
      WHATSAPP_BOT_NUMBER: ${WHATSAPP_BOT_NUMBER}
      UAZAPI_BASE_URL: ${UAZAPI_BASE_URL}
      UAZAPI_INSTANCE_TOKEN: ${UAZAPI_INSTANCE_TOKEN}
      UAZAPI_WEBHOOK_SECRET: ${UAZAPI_WEBHOOK_SECRET}
      META_WHATSAPP_TOKEN: ${META_WHATSAPP_TOKEN}
      META_WHATSAPP_PHONE_NUMBER_ID: ${META_WHATSAPP_PHONE_NUMBER_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      META_TEMPLATE_LEMBRETE: ${META_TEMPLATE_LEMBRETE}
      META_TEMPLATE_RESUMO: ${META_TEMPLATE_RESUMO}
      META_TEMPLATE_AVISO: ${META_TEMPLATE_AVISO}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      ASAAS_API_URL: ${ASAAS_API_URL:-https://api-sandbox.asaas.com/v3}
      ASAAS_API_KEY: ${ASAAS_API_KEY}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
      SUPPORT_WHATSAPP: ${SUPPORT_WHATSAPP}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      CRON_SECRET: ${CRON_SECRET}

  varredura:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on: [app]
    environment:
      CRON_SECRET: ${CRON_SECRET}
    command: ["sh", "-c", "sleep 20; while true; do curl -fsS -m 55 -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/sweep > /dev/null || echo 'varredura falhou'; sleep 60; done"]
